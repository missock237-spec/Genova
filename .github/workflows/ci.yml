# CI Pipeline — Gen3ia
# P0: Vérifie que le crate Rust NAPI compile avant tout déploiement
# Si le crate ne compile pas, le pipeline ÉCHOUE et bloque le merge.

name: CI

on:
  push:
    branches: [main, production, staging]
  pull_request:
    branches: [main, production]

env:
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: stable

jobs:
  # ================================================================
  # P0-5: Vérification de la compilation du crate NAPI agent-safety
  # ================================================================
  napi-compile-check:
    name: 'P0 — NAPI Crate Compilation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-napi-${{ runner.os }}-${{ hashFiles('crates/agent-safety/Cargo.toml', 'crates/agent-safety/Cargo.lock') }}
          restore-keys: cargo-napi-${{ runner.os }}-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NAPI CLI
        run: npm install -g @napi-rs/cli

      - name: Build agent-safety crate
        working-directory: crates/agent-safety
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          echo "✅ Crate compiled successfully"

      - name: Verify .node artifact exists
        working-directory: crates/agent-safety
        run: |
          if [ ! -f "target/release/libagent_safety.so" ]; then
            echo "❌ ERROR: libagent_safety.so not found after build"
            exit 1
          fi
          echo "✅ libagent_safety.so artifact verified"

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-napi-linux
          path: crates/agent-safety/target/release/libagent_safety.so
          retention-days: 7

  # ================================================================
  # TypeScript compilation check
  # ================================================================
  typescript-check:
    name: 'TypeScript Compilation'
    runs-on: ubuntu-latest
    needs: napi-compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download NAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-safety-napi-linux
          path: crates/agent-safety/

      - name: Type check
        run: npx tsc --noEmit --pretty 2>&1 | head -100

  # ================================================================
  # Unit tests
  # ================================================================
  unit-tests:
    name: 'Unit Tests'
    runs-on: ubuntu-latest
    needs: napi-compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download NAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-safety-napi-linux
          path: crates/agent-safety/

      - name: Run tests
        env:
          NEXT_PUBLIC_UNSAFE_ALLOW_JS_SAFETY: '1'
        run: npx vitest run --reporter=verbose 2>&1 | tail -50

  # ================================================================
  # P3-14: Security tests (adversarial prompts)
  # ================================================================
  security-tests:
    name: 'P3 — Security Adversarial Tests'
    runs-on: ubuntu-latest
    needs: napi-compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download NAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-safety-napi-linux
          path: crates/agent-safety/

      - name: Run security tests
        env:
          NEXT_PUBLIC_UNSAFE_ALLOW_JS_SAFETY: '1'
        run: npx vitest run --reporter=verbose src/__tests__/security/ 2>&1 | tail -50

      - name: Run guardrail tests
        env:
          NEXT_PUBLIC_UNSAFE_ALLOW_JS_SAFETY: '1'
        run: npx vitest run --reporter=verbose src/__tests__/guardrail.test.ts 2>&1 | tail -50

  # ================================================================
  # Lint check
  # ================================================================
  lint:
    name: 'ESLint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=0 2>&1 | tail -30

  # ================================================================
  # P0 Gate: All security checks must pass
  # ================================================================
  security-gate:
    name: '🔒 P0 Security Gate'
    runs-on: ubuntu-latest
    needs: [napi-compile-check, typescript-check, security-tests]
    if: always()
    steps:
      - name: Check all P0 jobs passed
        run: |
          echo "Checking P0 security gate results..."
          if [ "${{ needs.napi-compile-check.result }}" != "success" ]; then
            echo "❌ P0 FAILED: NAPI crate compilation check"
            exit 1
          fi
          if [ "${{ needs.security-tests.result }}" != "success" ]; then
            echo "❌ P0 FAILED: Security adversarial tests"
            exit 1
          fi
          echo "✅ P0 Security Gate PASSED"
